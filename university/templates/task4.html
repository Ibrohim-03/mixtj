<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 4 - Authors and Books</title>
</head>
<body>
    <h2>4. Authors and Their Books (prefetch_related)</h2>
    {% for author in authors %}
      <h3>{{ author.name }}</h3>
      <ul>
        {% for book in author.books.all %}
          <li>{{ book.title }} — Price: {{ book.price }}</li>
        {% empty %}
          <li>No books found</li>
        {% endfor %}
      </ul>
    {% endfor %}
</body>
</html>
