<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 6 - Average Grade per Student</title>
</head>
<body>
    <h2>6. Average Grade for Each Student (annotate)</h2>
    <ul>
      {% for student in students %}
        <li><strong>{{ student.name }}</strong>: Average Score = {{ student.avg_score|default:"No grades" }}</li>
      {% endfor %}
    </ul>
</body>
</html>
